[project]
name = "flybrain"
version = "0.1.0"
description = "dino-fly brain: FlyWire connectome LIF simulation, fixed transducers, game port and experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Tair Kaldybayev" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
# Exactly one of cpu / gpu must be selected:  uv sync --extra gpu   |   uv sync --extra cpu  (CI)
cpu = ["torch>=2.9"]
gpu = ["torch>=2.9"]
# Local validation only (experiments/make_brian2_golden.py). Never needed by CI.
brian2 = ["brian2>=2.9"]

[project.scripts]
flybrain = "flybrain.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flybrain"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not gpu and not data and not brian2'"
markers = [
  "gpu: needs a CUDA GPU",
  "data: needs the downloaded FlyWire data (flybrain download-data)",
  "brian2: needs the optional brian2 extra",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
  "E501",    # line length is the formatter's job; long comments/docstrings are fine
  "RUF001", "RUF002", "RUF003",  # allow unicode math symbols (θ, τ, ×) in strings/docstrings/comments
]

[tool.coverage.run]
branch = true
