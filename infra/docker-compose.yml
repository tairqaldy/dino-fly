# Local Postgres for apps/api.   docker compose -f infra/docker-compose.yml up -d
# Then:  DATABASE_URL=postgres://dinofly:dinofly@localhost:5433/dinofly pnpm --filter @dino-fly/api migrate
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dinofly
      POSTGRES_PASSWORD: dinofly # local development only
      POSTGRES_DB: dinofly
    ports:
      - "5433:5432"
    volumes:
      - dinofly-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinofly"]
      interval: 5s
      retries: 10
volumes:
  dinofly-pg:
