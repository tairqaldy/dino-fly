; dino-fly pose camera: Seeed XIAO ESP32S3 Sense (OV2640). Streams MJPEG over Wi-Fi; pose detection runs on the laptop.
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
