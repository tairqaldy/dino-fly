; dino-fly stats display: ESP32 DevKit (30-pin) + GMT130 1.3" IPS 240x240 ST7789 (no CS pin) + LED + 2 buttons + slide switch
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
